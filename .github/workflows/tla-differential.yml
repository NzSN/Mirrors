name: tla-differential

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Core/Tla/**'
      - 'Codec/TlaFrontendJson.lean'
      - 'Shell/Tla/**'
      - 'Docs/model-interface-compiler/**'
      - 'Drafts/tla-differential-validation-tasks.md'
      - 'test/fixtures/tla-frontend/**'
      - 'tools/tla-differential/**'
      - 'tools/ci/versions.env'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'tools/TlaDifferentialDriver.lean'
      - 'Shell/Apalache/SpecSource.lean'
      - '.github/workflows/tla-differential.yml'

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4+7'
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libssl-dev pkg-config
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Acquire pinned reference tools
        run: python3 tools/tla-differential/acquire.py --download
      - name: Build frontend and differential driver
        run: lake build tla_frontend tla_differential_driver
      - name: Run required differential gate
        run: python3 tools/tla-differential/run.py --required
      - name: Archive differential evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: tla-differential-evidence
          path: .golden-build/tla-differential/results/**
          if-no-files-found: warn
