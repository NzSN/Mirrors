name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (run this workflow from main)'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release/**'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tooling:
    # Retiring a tag must not build or publish a release for the deleted ref.
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test release identity, packaging, and refusal paths
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

  build:
    needs: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      commit: ${{ steps.build.outputs.commit }}
      historical: ${{ steps.build.outputs.historical }}
      prerelease: ${{ steps.build.outputs.prerelease }}
    steps:
      # Keep the workflow's release tooling separate from the original tagged
      # checkout, including for tags that predate this workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Validate requested tag
        id: select
        env:
          # Pull requests exercise the current v0.1.0 source without publishing.
          REQUESTED_TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && 'v0.1.0') || github.ref_name }}
        run: python3 release-tools/tools/release/release.py select --tag "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.select.outputs.tag }}
          path: source
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libssl-dev libgmp-dev pkg-config python3 openssl
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build unchanged tag, run non-model gates, and package
        id: build
        env:
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
        run: python3 release-tools/tools/release/release.py build --source source --tag "$RELEASE_TAG" --output dist
      - name: Check archive in a runtime without Lean or the source checkout
        env:
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          docker run --rm \
            -v "$PWD/dist:/artifacts:ro" \
            -v "$PWD/release-tools/tools/release:/release-tools:ro" \
            -e RELEASE_TAG \
            ubuntu:24.04 bash -euc '
              apt-get update
              apt-get install --no-install-recommends -y python3 libssl3t64 libgmp10
              cd /artifacts
              sha256sum --check SHA256SUMS
              python3 /release-tools/release.py check-archive --tag "$RELEASE_TAG" \
                --archive "/artifacts/mirrors-$RELEASE_TAG-linux-x86_64.tar.gz"
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.build.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
      HISTORICAL: ${{ needs.build.outputs.historical }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: artifacts
      - name: Create release with all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/publish.sh artifacts
